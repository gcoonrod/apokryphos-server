[package]
name = "apokryphos-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
# Internal test surface (e.g., config::load_from, shutdown::signal_listener_from_channel).
# Every integration test under server/tests/ declares required-features = ["test-utils"].
# Never enabled in release builds.
test-utils = []

[dependencies]
# Phase 3 (FAPI 2.0 + DPoP auth core) — see specs/003-fapi-dpop-auth-core/plan.md
# Complexity Tracking + research.md R1 for the justification of every new dep.
arc-swap = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ipnet = "2.10"
jsonwebtoken = "9"
openidconnect = "4.0"
parking_lot = "0.12"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2"

[dev-dependencies]
# Phase 3 dev-only — ephemeral keypair generation for the in-process OIDC mock
# (production never generates keys); trybuild for the subject-isolation compile-fail tests.
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rand_chacha = "0.3"
rsa = "0.9"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "test-util"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1"

[[test]]
name = "config_load"
required-features = ["test-utils"]

[[test]]
name = "proxy_trust_in_range"
required-features = ["test-utils"]

[[test]]
name = "proxy_trust_out_of_range"
required-features = ["test-utils"]

[[test]]
name = "proxy_trust_empty_list"
required-features = ["test-utils"]

[[test]]
name = "logging_redaction"
required-features = ["test-utils"]

[[test]]
name = "logging_events"
required-features = ["test-utils"]

[[test]]
name = "liveness"
required-features = ["test-utils"]

[[test]]
name = "shutdown_drain"
required-features = ["test-utils"]

# Phase 3 (FAPI 2.0 + DPoP auth core) — see specs/003-fapi-dpop-auth-core/tasks.md for the
# task-to-test mapping. Every stanza requires the existing test-utils feature so the in-crate
# test surface (auth::testing helpers, MockOidcProvider) is reachable from integration tests
# without polluting the release binary.

[[test]]
name = "cli_log_level"
required-features = ["test-utils"]

[[test]]
name = "auth_token_validation"
required-features = ["test-utils"]

[[test]]
name = "auth_dpop_validation"
required-features = ["test-utils"]

[[test]]
name = "auth_jwks_overlap_startup"
required-features = ["test-utils"]

[[test]]
name = "auth_jwks_refresh_scheduled"
required-features = ["test-utils"]

[[test]]
name = "auth_jwks_refresh_on_demand"
required-features = ["test-utils"]

[[test]]
name = "auth_disjoint_audiences_runtime"
required-features = ["test-utils"]

[[test]]
name = "whoami_vault_happy_path"
required-features = ["test-utils"]

[[test]]
name = "whoami_admin_happy_path"
required-features = ["test-utils"]

[[test]]
name = "cross_audience_isolation"
required-features = ["test-utils"]

[[test]]
name = "uniform_401_response"
required-features = ["test-utils"]

[[test]]
name = "subject_isolation"
required-features = ["test-utils"]

[[test]]
name = "log_redaction_auth"
required-features = ["test-utils"]

[[test]]
name = "auth_constant_time_timing"
required-features = ["test-utils"]

[[test]]
name = "auth_memory_pressure_503"
required-features = ["test-utils"]

[[test]]
name = "auth_replay_cleanup"
required-features = ["test-utils"]

# Workspace-level conformance harness — see research.md R14. Lives at the repository root
# (sibling of server/) so Phase 7 can extend it without source-file moves when the SPA crate
# joins and the repo converts to a true Cargo workspace.
[[test]]
name = "conformance"
path = "../tests/conformance/main.rs"
required-features = ["test-utils"]
