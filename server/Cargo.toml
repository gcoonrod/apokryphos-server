[package]
name = "apokryphos-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
# This binary is the self-hosted API tier of a homelab cypher-block
# vault. The repository as a whole is open-source and auditable
# end-to-end under AGPL-3.0-or-later (see `LICENSE` at repo root);
# the AGPL's network-use clause is intentional for a self-hosted
# blind-server design (anyone running a modified server tier MUST
# publish their modifications, even when access is over a network).
#
# `publish = false` because this is a binary crate; it's never
# uploaded to crates.io. It would still build and link fine if
# someone tried, but `publish = false` prevents accidental upload.
publish = false

[features]
# Internal test surface (e.g., config::load_from, shutdown::signal_listener_from_channel,
# auth::testing::*). Every integration test under server/tests/ declares
# required-features = ["test-utils"]. Never enabled in release builds.
#
# Phase 3: the auth::testing helpers need ephemeral key generation (rsa, p256, rand,
# rand_chacha). These are optional dependencies activated only when test-utils is on —
# they're absent from the release binary. This pattern is required because Cargo's
# [dev-dependencies] are not visible to the lib crate itself, only to test/example/bench
# targets, so test-utils-gated lib code cannot rely on [dev-dependencies].
test-utils = ["dep:rsa", "dep:p256", "dep:rand", "dep:rand_chacha"]

[dependencies]
# Phase 3 (FAPI 2.0 + DPoP auth core) — see specs/003-fapi-dpop-auth-core/plan.md
# Complexity Tracking + research.md R1 for the justification of every new dep.
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ipnet = "2.10"
jsonwebtoken = "9"
openidconnect = "4.0"
parking_lot = "0.12"
# Phase 3 test-utils-gated optional deps. Activated only by the `test-utils`
# Cargo feature (see [features] above) so the production binary still excludes
# all key-generation code paths. These must be regular [dependencies] (not
# [dev-dependencies]) because [dev-dependencies] are invisible to the lib
# crate itself, which is where `auth::testing` lives behind `cfg(feature = "test-utils")`.
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
rsa = { version = "0.9", optional = true }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2"
thiserror = "2.0"
tempfile = "3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
toml = "0.8"
# `tower` was Phase 2 dev-only (integration-test `ServiceExt::oneshot`).
# Phase 3 promotes it to a regular dep because `auth::middleware::VaultGuard`
# / `AdminGuard` implement `tower::Layer` as part of the public lib surface.
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "test-util", "fs"] }
# Re-listed here (with the `util` feature) for `tower::ServiceExt::oneshot`
# in integration tests; the runtime dep above lacks `util` to keep the
# release binary slim.
tower = { version = "0.5", features = ["util"] }
libc = "0.2"
trybuild = "1"
walkdir = "2"

[[test]]
name = "config_load"
required-features = ["test-utils"]

[[test]]
name = "proxy_trust_in_range"
required-features = ["test-utils"]

[[test]]
name = "proxy_trust_out_of_range"
required-features = ["test-utils"]

[[test]]
name = "proxy_trust_empty_list"
required-features = ["test-utils"]

[[test]]
name = "logging_redaction"
required-features = ["test-utils"]

[[test]]
name = "logging_events"
required-features = ["test-utils"]

[[test]]
name = "liveness"
required-features = ["test-utils"]

[[test]]
name = "shutdown_drain"
required-features = ["test-utils"]

# Phase 3 (FAPI 2.0 + DPoP auth core) — see specs/003-fapi-dpop-auth-core/tasks.md for the
